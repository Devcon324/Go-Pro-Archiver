[project]
name = "gopro-footage-archiver"
version = "0.1.0"
description = "Desktop app to archive GoPro MP4 footage from SD cards with smart deduplication."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=18.1.0",
    "customtkinter>=6.0.0",
    "psutil>=7.2.2",
    "tkcalendar>=1.6.1",
]

[project.scripts]
gopro-archiver = "gopro_archiver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gopro_archiver"]

[dependency-groups]
dev = [
    "pyinstaller>=6.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
