name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release executables
        run: |
          uv run pyinstaller packaging/gopro_archiver.spec --noconfirm --clean
          uv run pyinstaller packaging/uninstall.spec --noconfirm

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $zip = "dist/GoPro-Footage-Archiver-${version}-windows-x64.zip"
          Compress-Archive -Path dist/GoPro-Footage-Archiver.exe, dist/Uninstall.exe -DestinationPath $zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/GoPro-Footage-Archiver-${{ steps.version.outputs.tag }}-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries (Tk / GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev libgl1 libglib2.0-0 libxrender1 libxext6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Read version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release executables
        run: |
          uv run pyinstaller packaging/gopro_archiver_linux.spec --noconfirm --clean
          uv run pyinstaller packaging/uninstall.spec --noconfirm
          chmod +x dist/GoPro-Footage-Archiver dist/Uninstall

      - name: Create tarball
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          tar czvf "dist/GoPro-Footage-Archiver-${VERSION}-linux-x64.tar.gz" \
            -C dist GoPro-Footage-Archiver Uninstall

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/GoPro-Footage-Archiver-${{ steps.version.outputs.tag }}-linux-x64.tar.gz

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist

      - name: Read version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GoPro-Footage-Archiver-${{ steps.version.outputs.tag }}-windows-x64.zip
            dist/GoPro-Footage-Archiver-${{ steps.version.outputs.tag }}-linux-x64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
